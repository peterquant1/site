<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07080a">
    <title>页面不存在 — 狗庄74吧</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        @font-face{font-family:"Geist";src:url("/fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-2013,U+2015-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
        @font-face{font-family:"Geist Mono";src:url("/fonts/geist-mono-latin.woff2") format("woff2");font-weight:100 900;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F,U+2212}
        :root{
            color-scheme:dark;
            --bg:#07080a; --text:#f3f4f6; --muted:#a8aebb; --accent:#6c74ff;
            --grad-ink:linear-gradient(120deg,#8fb6ff 0%,#a9a4ff 52%,#cfa8ff 100%);
            --aur-1:rgba(79,141,255,.22); --aur-2:rgba(165,107,255,.17); --dot:rgba(255,255,255,.085);
        }
        @media (prefers-color-scheme:light){
            :root{ color-scheme:light; --bg:#f6f7f9; --text:#0b0c10; --muted:#4d5360; --accent:#5560f5;
                --grad-ink:linear-gradient(120deg,#2f62d9 0%,#5548e0 52%,#8a3fd6 100%);
                --aur-1:rgba(79,141,255,.17); --aur-2:rgba(165,107,255,.13); --dot:rgba(15,18,30,.1); }
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            position:relative; isolation:isolate;
            font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
            background:var(--bg); color:var(--text); min-height:100vh;
            display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
            -webkit-font-smoothing:antialiased;
        }
        body::before{content:"";position:absolute;z-index:-1;inset:0 0 auto 0;height:70vh;pointer-events:none;
            background:
                linear-gradient(180deg,transparent 12%,var(--bg) 82%),
                radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0 / 24px 24px,
                radial-gradient(ellipse 50% 70% at 22% -10%,var(--aur-1),transparent 72%),
                radial-gradient(ellipse 46% 64% at 82% -12%,var(--aur-2),transparent 72%)}
        .card{max-width:380px}
        .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;font-weight:600;font-size:16px;letter-spacing:-.01em}
        .brand svg{width:28px;height:28px;border-radius:8px;box-shadow:0 6px 18px -4px rgba(124,131,255,.7)}
        .code{font-family:"Geist Mono",ui-monospace,Consolas,monospace;font-size:88px;font-weight:500;letter-spacing:-.04em;line-height:1;
            color:var(--accent);background:var(--grad-ink);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        p{color:var(--muted);margin:18px 0 30px;font-size:14px;line-height:1.75}
        a.home{
            display:inline-flex; align-items:center; height:42px; padding:0 28px; border-radius:10px;
            color:#fff; font-weight:500; font-size:14px; text-decoration:none;
            border:1px solid rgba(255,255,255,.16);
            background:linear-gradient(135deg,#5560f5,#7b52ee);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 8px 22px -8px rgba(99,102,241,.55);
            transition:box-shadow .15s;
        }
        a.home:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px -8px rgba(99,102,241,.7)}
        a.home:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#4f8dff"/><stop offset=".5" stop-color="#6c6cff"/><stop offset="1" stop-color="#a56bff"/>
                </linearGradient></defs>
                <rect width="32" height="32" rx="8" fill="url(#gm)"/>
                <rect x="7.5" y="17" width="4" height="8" rx="1.6" fill="#fff" fill-opacity=".72"/>
                <rect x="14" y="12" width="4" height="13" rx="1.6" fill="#fff" fill-opacity=".86"/>
                <rect x="20.5" y="7" width="4" height="18" rx="1.6" fill="#fff"/>
            </svg>
            <span>狗庄74吧</span>
        </div>
        <div class="code">404</div>
        <p>这个页面不存在 —— 榜单都在首页。<br>Page not found — all lists are on the home page.</p>
        <a class="home" href="/">回到排行榜 / Back to lists</a>
    </div>
</body>
</html>
